name: Check hosted routing

on:
  pull_request:
    paths:
      - 'marine_routing/**'
      - 'cloud_server.py'
      - 'requirements*.txt'
      - 'tests/test*py'
      - 'tests/routing_fixture_worker.py'
      - 'android-client/online-routing**'
      - 'android-client/online-routing/**'
      - '.github/workflows/check-routing.yml'
  push:
    branches: [main]
    paths:
      - 'marine_routing/**'
      - 'cloud_server.py'
      - 'requirements*.txt'
      - 'android-client/online-routing**'
      - 'android-client/online-routing/**'
      - '.github/workflows/check-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-radar.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          SEAPOINT_ROUTE_TIMING: '0'
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 installation
        shell: powershell
        run: ./android-client/online-routing/installer-smoke.ps1
      - name: PowerShell 7 installation
        shell: pwsh
        run: ./android-client/online-routing/installer-smoke.ps1
