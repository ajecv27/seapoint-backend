name: Publish radar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-radar.yml'
      - 'static_site/**'
      - 'radar_view.py'
      - 'rain_motion.js'
      - 'basemap_service.py'
      - 'forecast_maps.py'
      - 'forecast_service.py'
      - 'arome_maps.py'
      - 'requirements.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore model downloads and retained image generations
        uses: actions/cache/restore@v4
        with:
          path: |
            .radar-cache
            _site
          key: radar-static-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-static-v1-
      - name: Install forecast decoders
        run: python -m pip install -r requirements.txt
      - name: Validate publication and provider selection
        run: python -m unittest discover -s tests -p 'test_static_site.py'
      - name: Prepare a complete buffered forecast
        run: python static_site/export.py --output _site --cache .radar-cache --timeout 720
      - name: Retain verified downloads for the next build
        uses: actions/cache/save@v4
        with:
          path: |
            .radar-cache
            _site
          key: radar-static-v1-${{ github.run_id }}-${{ github.run_attempt }}
      # Enable Settings > Pages > Source: GitHub Actions once before this step.
      # GITHUB_TOKEN cannot enable the repository's Pages administration setting.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy the complete site atomically
        id: deployment
        uses: actions/deploy-pages@v4
