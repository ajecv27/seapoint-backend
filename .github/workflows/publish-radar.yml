name: Publish radar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-radar.yml'
      - '.github/actions/wait-pages-artifact/**'
      - 'static_site/**'
      - 'radar_view.py'
      - 'rain_motion.js'
      - 'global_rain.js'
      - 'global_forecast.py'
      - 'basemap_service.py'
      - 'forecast_maps.py'
      - 'forecast_service.py'
      - 'arome_maps.py'
      - 'requirements.txt'
      - 'requirements-radar.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-radar.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/actions/wait-pages-artifact/package-lock.json
      - name: Install the artifact readiness guard
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/actions/wait-pages-artifact
      - name: Restore model downloads and retained image generations
        uses: actions/cache/restore@v4
        with:
          path: |
            .radar-cache
            _site
          key: radar-static-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-static-v1-
      - name: Install forecast decoders
        run: python -m pip install -r requirements-radar.txt
      - name: Validate publication and provider selection
        run: |
          python -m unittest discover -s tests -p 'test_static_site.py'
          python -m unittest discover -s tests -p 'test_global_forecast.py'
          node tests/global_rain_test.js
          node --test .github/actions/wait-pages-artifact/wait.test.cjs
      - name: Prepare a complete buffered forecast
        run: python static_site/export.py --output _site --cache .radar-cache --timeout 960
      - name: Retain verified downloads for the next build
        uses: actions/cache/save@v4
        with:
          path: |
            .radar-cache
            _site
          key: radar-static-v1-${{ github.run_id }}-${{ github.run_attempt }}
      # Enable Settings > Pages > Source: GitHub Actions once before this step.
      # GITHUB_TOKEN cannot enable the repository's Pages administration setting.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: radar_upload
        with:
          name: github-pages
          path: _site
      - name: Wait for GitHub to recognize the radar upload
        uses: ./.github/actions/wait-pages-artifact
        with:
          artifact-id: ${{ steps.radar_upload.outputs.artifact_id }}
          artifact-name: github-pages
          timeout-seconds: '120'
      - name: Deploy the complete site atomically
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
